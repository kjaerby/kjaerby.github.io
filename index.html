<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THMSNX-HAVEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --violet: #8a5cf6;
    --violet-bright: #c3a6ff;
    --violet-deep: #4a2f8a;
    --rose: #dba8e0;
    --rose-bright: #f0c9f4;
    --ink: #0d0c0a;
    --panel: rgba(15,10,22,0.86);
    --cream: #ece4d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',sans-serif;}
  canvas{display:block;}

  #crosshair{
    position:fixed;top:50%;left:50%;width:6px;height:6px;
    transform:translate(-50%,-50%);border-radius:50%;
    background:var(--violet-bright);opacity:0.9;
    box-shadow:0 0 8px rgba(195,166,255,0.9);
    pointer-events:none;z-index:20;
  }

  #hint{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    color:var(--cream);font-size:13px;letter-spacing:0.04em;
    background:var(--panel);padding:9px 18px;border-radius:20px;
    border:1px solid rgba(138,92,246,0.45);
    pointer-events:none;z-index:20;transition:opacity 0.6s ease;
  }

  #proximity-caption{
    position:fixed;top:34px;left:50%;transform:translateX(-50%);
    color:var(--violet-bright);font-family:'Cormorant Garamond',serif;
    font-size:22px;font-style:italic;letter-spacing:0.02em;
    text-shadow:0 2px 10px rgba(0,0,0,0.9);
    pointer-events:none;z-index:20;opacity:0;transition:opacity 0.4s ease;
    text-align:center;
  }

  #fps-note{
    position:fixed;top:14px;right:16px;color:#7c6e94;font-size:11px;
    letter-spacing:0.05em;pointer-events:none;z-index:20;opacity:0.55;
    font-family:'Inter',sans-serif;
  }

  #overlay-start{
    position:fixed;inset:0;z-index:50;
    background:
      radial-gradient(ellipse at center, rgba(90,50,140,0.5), rgba(4,2,8,0.96)),
      #05030a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  #overlay-start .eyebrow{
    color:var(--violet-bright);letter-spacing:0.35em;font-size:11px;
    text-transform:uppercase;margin-bottom:18px;font-weight:600;
  }
  #overlay-start h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    color:var(--cream);font-size:clamp(38px,7vw,72px);margin:0 0 14px;
    letter-spacing:0.02em;
  }
  #overlay-start .tagline{
    color:#c3b8d6;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:clamp(16px,2.4vw,20px);max-width:520px;margin:0 0 34px;line-height:1.5;
  }
  #enter-btn{
    background:linear-gradient(180deg,var(--violet-bright),var(--violet));
    color:#150a2b;border:none;padding:14px 34px;border-radius:2px;
    font-size:14px;letter-spacing:0.12em;text-transform:uppercase;
    font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  #enter-btn:hover{filter:brightness(1.08);}
  #overlay-start .note{
    color:#61577a;font-size:11.5px;margin-top:22px;max-width:420px;line-height:1.6;
  }
  #overlay-start .divider{
    width:60px;height:1px;background:var(--violet);opacity:0.6;margin:22px 0;
  }
</style>
</head>
<body>

<div id="overlay-start">
  <div class="eyebrow">En digital have</div>
  <h1>THMSNX&#8202;-&#8202;HAVEN</h1>
  <p class="tagline">Gå ind, vandr frit rundt i det lilla skær, og dvæl ved broen over vandet. Et sted rejst i beundring.</p>
  <button id="enter-btn">Gå ind i haven</button>
  <div class="divider"></div>
  <div class="note">Styring: W A S D for at gå, musen for at kigge dig omkring, Esc for at frigive musen.</div>
</div>

<div id="crosshair"></div>
<div id="proximity-caption"></div>
<div id="hint">W A S D — gå &nbsp;•&nbsp; Mus — kig dig omkring &nbsp;•&nbsp; Esc — frigør musen</div>

						newIndices.push( index.getX( i + 1 ) );

							newIndices.push( index.getX( i + 2 ) );

						} else {

							newIndices.push( index.getX( i + 2 ) );
							newIndices.push( index.getX( i + 1 ) );
							newIndices.push( index.getX( i ) );

		/**

   * @param {Mesh | Line | Points} object An instance of Mesh, Line or Points.
   * @return {Object} An Object with original position/normal attributes and morphed ones.

		static computeMorphedAttributes( object ) {

			if ( object.geometry.isBufferGeometry !== true ) {

				console.error( 'THREE.BufferGeometryUtils: Geometry is not of type THREE.BufferGeometry.' );
				return null;

			}

			const _vA = new THREE.Vector3();

			const _vB = new THREE.Vector3();

			const _vC = new THREE.Vector3();

			const _tempA = new THREE.Vector3();

			const _tempB = new THREE.Vector3();

			const _tempC = new THREE.Vector3();

			const _morphA = new THREE.Vector3();

			const _morphB = new THREE.Vector3();

			const _morphC = new THREE.Vector3();

			function _calculateMorphedAttributeData( object, material, attribute, morphAttribute, morphTargetsRelative, a, b, c, modifiedAttributeArray ) {

				_vA.fromBufferAttribute( attribute, a );

				_vB.fromBufferAttribute( attribute, b );

				_vC.fromBufferAttribute( attribute, c );

				const morphInfluences = object.morphTargetInfluences;

				if ( material.morphTargets && morphAttribute && morphInfluences ) {

					_morphA.set( 0, 0, 0 );

					_morphB.set( 0, 0, 0 );

					_morphC.set( 0, 0, 0 );

					for ( let i = 0, il = morphAttribute.length; i < il; i ++ ) {

						const influence = morphInfluences[ i ];
						const morph = morphAttribute[ i ];
						if ( influence === 0 ) continue;

						_tempA.fromBufferAttribute( morph, a );

						_tempB.fromBufferAttribute( morph, b );

						_tempC.fromBufferAttribute( morph, c );

						if ( morphTargetsRelative ) {

							_morphA.addScaledVector( _tempA, influence );

							_morphB.addScaledVector( _tempB, influence );

							_morphC.addScaledVector( _tempC, influence );

						} else {

							_morphA.addScaledVector( _tempA.sub( _vA ), influence );

							_morphB.addScaledVector( _tempB.sub( _vB ), influence );

							_morphC.addScaledVector( _tempC.sub( _vC ), influence );

						}

					}

					_vA.add( _morphA );

					_vB.add( _morphB );

					_vC.add( _morphC );

				}

				if ( object.isSkinnedMesh ) {

					object.boneTransform( a, _vA );
					object.boneTransform( b, _vB );
					object.boneTransform( c, _vC );

				}

				modifiedAttributeArray[ a * 3 + 0 ] = _vA.x;
				modifiedAttributeArray[ a * 3 + 1 ] = _vA.y;
				modifiedAttributeArray[ a * 3 + 2 ] = _vA.z;
				modifiedAttributeArray[ b * 3 + 0 ] = _vB.x;
				modifiedAttributeArray[ b * 3 + 1 ] = _vB.y;
				modifiedAttributeArray[ b * 3 + 2 ] = _vB.z;
				modifiedAttributeArray[ c * 3 + 0 ] = _vC.x;
				modifiedAttributeArray[ c * 3 + 1 ] = _vC.y;
				modifiedAttributeArray[ c * 3 + 2 ] = _vC.z;

			}

			const geometry = object.geometry;
			const material = object.material;
			let a, b, c;
			const index = geometry.index;
			const positionAttribute = geometry.attributes.position;
			const morphPosition = geometry.morphAttributes.position;
			const morphTargetsRelative = geometry.morphTargetsRelative;
			const normalAttribute = geometry.attributes.normal;
			const morphNormal = geometry.morphAttributes.position;
			const groups = geometry.groups;
			const drawRange = geometry.drawRange;
			let i, j, il, jl;
			let group, groupMaterial;
			let start, end;
			const modifiedPosition = new Float32Array( positionAttribute.count * positionAttribute.itemSize );
			const modifiedNormal = new Float32Array( normalAttribute.count * normalAttribute.itemSize );

			if ( index !== null ) {

				// indexed buffer geometry
				if ( Array.isArray( material ) ) {

					for ( i = 0, il = groups.length; i < il; i ++ ) {

						group = groups[ i ];
						groupMaterial = material[ group.materialIndex ];
						start = Math.max( group.start, drawRange.start );
						end = Math.min( group.start + group.count, drawRange.start + drawRange.count );

						for ( j = start, jl = end; j < jl; j += 3 ) {

							a = index.getX( j );
							b = index.getX( j + 1 );
							c = index.getX( j + 2 );

							_calculateMorphedAttributeData( object, groupMaterial, positionAttribute, morphPosition, morphTargetsRelative, a, b, c, modifiedPosition );

							_calculateMorphedAttributeData( object, groupMaterial, normalAttribute, morphNormal, morphTargetsRelative, a, b, c, modifiedNormal );

						}

					}

				} else {

					start = Math.max( 0, drawRange.start );
					end = Math.min( index.count, drawRange.start + drawRange.count );

					for ( i = start, il = end; i < il; i += 3 ) {

						a = index.getX( i );
						b = index.getX( i + 1 );
						c = index.getX( i + 2 );

						_calculateMorphedAttributeData( object, material, positionAttribute, morphPosition, morphTargetsRelative, a, b, c, modifiedPosition );

						_calculateMorphedAttributeData( object, material, normalAttribute, morphNormal, morphTargetsRelative, a, b, c, modifiedNormal );

					}

				}

			} else if ( positionAttribute !== undefined ) {

				// non-indexed buffer geometry
				if ( Array.isArray( material ) ) {

					for ( i = 0, il = groups.length; i < il; i ++ ) {

						group = groups[ i ];
						groupMaterial = material[ group.materialIndex ];
						start = Math.max( group.start, drawRange.start );
						end = Math.min( group.start + group.count, drawRange.start + drawRange.count );

						for ( j = start, jl = end; j < jl; j += 3 ) {

							a = j;
							b = j + 1;
							c = j + 2;

							_calculateMorphedAttributeData( object, groupMaterial, positionAttribute, morphPosition, morphTargetsRelative, a, b, c, modifiedPosition );

							_calculateMorphedAttributeData( object, groupMaterial, normalAttribute, morphNormal, morphTargetsRelative, a, b, c, modifiedNormal );

						}

					}

				} else {

					start = Math.max( 0, drawRange.start );
					end = Math.min( positionAttribute.count, drawRange.start + drawRange.count );

					for ( i = start, il = end; i < il; i += 3 ) {

						a = i;
						b = i + 1;
						c = i + 2;

						_calculateMorphedAttributeData( object, material, positionAttribute, morphPosition, morphTargetsRelative, a, b, c, modifiedPosition );

						_calculateMorphedAttributeData( object, material, normalAttribute, morphNormal, morphTargetsRelative, a, b, c, modifiedNormal );

					}

				}

			}

			const morphedPositionAttribute = new THREE.Float32BufferAttribute( modifiedPosition, 3 );
			const morphedNormalAttribute = new THREE.Float32BufferAttribute( modifiedNormal, 3 );
			return {
				positionAttribute: positionAttribute,
				normalAttribute: normalAttribute,
				morphedPositionAttribute: morphedPositionAttribute,
				morphedNormalAttribute: morphedNormalAttribute
			};

		}

	}

} )();

/* ===========================================================
   TEXT TEXTURE HELPERS
=========================================================== */
function wrapText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for(const word of words){
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = word;
    } else { line = test; }
  }
  if(line) lines.push(line);
  return lines;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function makePlaqueTexture({heading, body, w=768, h=384, headingSize=40, bodySize=25, accent='#8a5cf6', accentText='#c3a6ff'}){
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(12,8,18,0.92)';
  roundRect(ctx, 4,4,w-8,h-8,10); ctx.fill();
  ctx.strokeStyle = accent; ctx.lineWidth = 3;
  roundRect(ctx, 10,10,w-20,h-20,8); ctx.stroke();

  let y = h*0.32;
  if(heading){
    ctx.fillStyle = accentText;
    ctx.font = `600 ${headingSize}px 'Cormorant Garamond', serif`;
    ctx.textAlign = 'center';
    ctx.fillText(heading, w/2, y);
    y += headingSize*0.9;
  }
  if(body){
    ctx.fillStyle = '#e8e0f2';
    ctx.font = `italic ${bodySize}px 'Cormorant Garamond', serif`;
    ctx.textAlign = 'center';
    const lines = wrapText(ctx, body, w*0.82);
    lines.forEach(l=>{ y += bodySize*1.15; ctx.fillText(l, w/2, y); });
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makeRomanticTexture({heading, body}){
  const w=1024,h=520;
  const canvas = document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(38,20,58,0.95)'); grad.addColorStop(1,'rgba(14,9,20,0.97)');
  ctx.fillStyle = grad;
  roundRect(ctx,4,4,w-8,h-8,16); ctx.fill();
  ctx.strokeStyle = '#dba8e0'; ctx.lineWidth = 3;
  roundRect(ctx,12,12,w-24,h-24,14); ctx.stroke();

  ctx.fillStyle = '#f0c9f4';
  ctx.font = "48px serif";
  ctx.textAlign = 'center';
  ctx.fillText('♥', w/2, 90);

  ctx.fillStyle = '#f0c9f4';
  ctx.font = "600 50px 'Cormorant Garamond', serif";
  ctx.fillText(heading, w/2, 170);

  ctx.fillStyle = '#ecdff2';
  ctx.font = "italic 30px 'Cormorant Garamond', serif";

  const lines = wrapText(ctx, body, w*0.78);
  lines.forEach(l=>{ y += 40; ctx.fillText(l, w/2, y); });

}

/* ===========================================================
   WHITE LILIES — trumpet-shaped petals with recurved tips,
   long protruding stamens, buds, and slender leaves —
   modelled after true Lilium blooms.

   PERFORMANCE NOTE: the whole plant (stems, leaves, blooms, buds)
   is baked into a small number of MERGED geometries — one per
   material — and every lily clump on the map is then drawn with
   THREE.InstancedMesh. That takes ~1,100 separate draw calls
   (the original per-mesh approach) down to just 3, which is the
   main fix for the walking/looking lag.
=========================================================== */
const petalMat = new THREE.MeshStandardMaterial({color:0xfbfaf4, roughness:0.32, metalness:0.02, envMapIntensity:0.8, side:THREE.DoubleSide});
const filamentAntherMat = new THREE.MeshStandardMaterial({color:0xf5efe0, roughness:0.4, metalness:0.05, vertexColors:true, emissive:0x3a220c, emissiveIntensity:0.12});
const greenMat = new THREE.MeshStandardMaterial({color:0x3f5a3c, roughness:0.6, metalness:0.05, vertexColors:true, side:THREE.DoubleSide});

// ---- helper: bend a flat petal shape into a trumpet blade with a
// recurved (backward-curling) tip, like Lilium candidum / longiflorum ----
function buildPetalGeometry(){
  const length = 0.62, width = 0.16;
  const shape = new THREE.Shape();
  const halfW = width/2;
  shape.moveTo(-halfW*0.25, 0);
  shape.quadraticCurveTo(-halfW, length*0.28, -halfW*0.82, length*0.62);
  shape.quadraticCurveTo(-halfW*0.4, length*0.92, 0, length);
  shape.quadraticCurveTo(halfW*0.4, length*0.92, halfW*0.82, length*0.62);
  shape.quadraticCurveTo(halfW, length*0.28, halfW*0.25, 0);
  shape.closePath();

  const geo = new THREE.ShapeGeometry(shape, 12);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    const t = v.y / length;
    const cup = (1-Math.min(t/0.4,1)) * Math.pow(v.x,2) * 1.8;
    const recurveT = Math.max(0, t-0.5)/0.5;
    const recurve = Math.pow(recurveT,1.6) * 0.42;
    const bow = Math.sin(t*Math.PI*0.5) * 0.05;
    v.z = -cup + bow - recurve;
    v.y = v.y + Math.pow(recurveT,2)*0.05;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// bake a local-space transform into a cloned geometry's vertices, so many
// pieces can be merged into one static BufferGeometry
function bakeTransform(geo, pos, rotXYZ, scale){
  const g = geo.clone();
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rotXYZ.x||0, rotXYZ.y||0, rotXYZ.z||0));
  m.compose(
    new THREE.Vector3(pos.x||0,pos.y||0,pos.z||0),
    q,
    new THREE.Vector3(scale===undefined?1:scale, scale===undefined?1:scale, scale===undefined?1:scale)
  );
  g.applyMatrix4(m);
  return g;
}

function tintGeometry(geo, hex){
  const c = new THREE.Color(hex);
  const count = geo.attributes.position.count;
  const colors = new Float32Array(count*3);
  for(let i=0;i<count;i++){ colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  return geo;
}

const basePetalGeo = buildPetalGeometry();

function buildLilyBloomPieces(originOffset, rot){
  const pieces = [];
  const petalCount = 6;
  for(let i=0;i<petalCount;i++){
    const whorl = i % 2;
    const angle = (i/petalCount)*Math.PI*2 + (whorl?0.5:0);
    const outward = whorl===0 ? 0.62 : 0.5;
    const petalRot = new THREE.Euler(-Math.PI/2 + 0.15 + outward, 0, angle);
    // compose bloom's own rotation on top
    const q = new THREE.Quaternion().setFromEuler(petalRot);
    const qBloom = new THREE.Quaternion().setFromEuler(new THREE.Euler(rot.x,rot.y,rot.z));
    q.premultiply(qBloom);
    const finalEuler = new THREE.Euler().setFromQuaternion(q);
    pieces.push(bakeTransform(basePetalGeo, originOffset, finalEuler, 1));
  }
  return pieces;
}

// filament+anther "stamen" as one small merged shape (cylinder + capsule-ish tip)
const filamentGeo = new THREE.CylinderGeometry(0.004,0.007,0.3,5);
filamentGeo.translate(0,0.15,0);
const antherGeo = new THREE.CylinderGeometry(0.018,0.018,0.06,6);
antherGeo.rotateZ(Math.PI/2);

const pistilGeo = new THREE.CylinderGeometry(0.006,0.01,0.34,6);
pistilGeo.translate(0,0.17,0);

function buildStamenPieces(originOffset, bloomRot){
  const pieces = [];
  const q0 = new THREE.Quaternion().setFromEuler(new THREE.Euler(bloomRot.x,bloomRot.y,bloomRot.z));
  const pistilQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.35,0,0));
  pistilQ.premultiply(q0);
  pieces.push(tintGeometry(bakeTransform(pistilGeo, originOffset, new THREE.Euler().setFromQuaternion(pistilQ), 1), 0xf5efe0));

  const stamenCount = 6;
  for(let i=0;i<stamenCount;i++){
    const a = (i/stamenCount)*Math.PI*2;
    const r = 0.05;
    const fPos = new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r*0.6+0.03).applyQuaternion(q0).add(originOffset);
    const fRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.4+Math.sin(a)*0.06, 0, Math.cos(a)*0.15));
    fRot.premultiply(q0);
    pieces.push(tintGeometry(bakeTransform(filamentGeo, fPos, new THREE.Euler().setFromQuaternion(fRot), 1), 0xf5efe0));

    const aPos = new THREE.Vector3(Math.cos(a)*r*1.35, 0.14, Math.sin(a)*r*0.8+0.13).applyQuaternion(q0).add(originOffset);
    const aRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.4+Math.sin(a)*0.06, 0, Math.PI/2+Math.cos(a)*0.15));
    aRot.premultiply(q0);
    pieces.push(tintGeometry(bakeTransform(antherGeo, aPos, new THREE.Euler().setFromQuaternion(aRot), 1), 0xa8632a));
  }
  return pieces;
}

// ---- assemble ONE full lily plant's geometry (stems+leaves+buds in one
// "green" merged geo, blooms' petals in one "petal" merged geo, stamens
// in one "stamen" merged geo) ----
const petalPiecesAll = [];
const greenPiecesAll = [];   // stems + leaves + bud cones (tinted green/cream)
const stamenPiecesAll = [];

const stemPositions = [
  {h:0.58, tilt:0.1,  rotY:0,    kind:'bloom'},
  {h:0.5,  tilt:-0.16,rotY:2.1,  kind:'bloom'},
  {h:0.63, tilt:0.18, rotY:4.2,  kind:'bloom'},
  {h:0.7,  tilt:0.05, rotY:1.1,  kind:'bud'},
  {h:0.66, tilt:-0.08,rotY:3.4,  kind:'bud'},
];

stemPositions.forEach(sp=>{
  // stem: unit cylinder scaled to (r, h, r) then rotated/positioned
  const stemQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0,sp.rotY,sp.tilt));
  const stemGeo = stemGeoBase.clone();
  stemGeo.scale(0.016, sp.h, 0.016);
  const stemBaked = bakeTransform(stemGeo, new THREE.Vector3(0,sp.h/2,0).applyQuaternion(stemQ), new THREE.Euler().setFromQuaternion(stemQ), 1);
  greenPiecesAll.push(tintGeometry(stemBaked, 0x3f5a3c));

  // two leaves per stem
  [0.55, 0.78].forEach((frac, li)=>{
    const leafPos = new THREE.Vector3(Math.sin(sp.rotY)*0.05, sp.h*frac, Math.cos(sp.rotY)*0.05);
    const leafRotZ = (Math.PI/2.3) * (sp.rotY>3?-1:1) * (li===1?-1:1);
    const leafQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, sp.rotY, leafRotZ));
    const leafBaked = bakeTransform(leafGeoBase, leafPos, new THREE.Euler().setFromQuaternion(leafQ), 1);
    greenPiecesAll.push(tintGeometry(leafBaked, 0x3a5636));
  });

  const topOffset = new THREE.Vector3(
    Math.sin(sp.tilt)*sp.h*0.5*Math.sin(sp.rotY),
    sp.h,
    Math.sin(sp.tilt)*sp.h*0.5*Math.cos(sp.rotY)
  );

  if(sp.kind==='bloom'){
    const bloomRot = new THREE.Euler(0.55+Math.sin(sp.rotY)*0.1, sp.rotY+Math.PI, sp.tilt*0.6);
    petalPiecesAll.push(...buildLilyBloomPieces(topOffset, bloomRot));
    stamenPiecesAll.push(...buildStamenPieces(topOffset, bloomRot));
  } else {
    const budQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, sp.rotY, sp.tilt*0.5+0.25));
    const budBaked = bakeTransform(budConeGeo, topOffset, new THREE.Euler().setFromQuaternion(budQ), 1.15);
    greenPiecesAll.push(tintGeometry(budBaked, 0xd9dcc0));
    const blushPos = topOffset.clone();
    const blushBaked = bakeTransform(budBlushGeo, blushPos, new THREE.Euler().setFromQuaternion(budQ), 1.15);
    greenPiecesAll.push(tintGeometry(blushBaked, 0xe8ddb0));
  }
});

const lilyPetalGeo = THREE.BufferGeometryUtils.mergeBufferGeometries(petalPiecesAll);
const lilyStamenGeo = THREE.BufferGeometryUtils.mergeBufferGeometries(stamenPiecesAll);
const lilyGreenGeo = THREE.BufferGeometryUtils.mergeBufferGeometries(greenPiecesAll);

  [-4.6, POND_Z+2.6, 1.1, 0.8], [-4.1, POND_Z+2.2, 0.8, 2.1],
  [4.6, POND_Z+2.6, 1.1, -0.8], [4.1, POND_Z+2.2, 0.8, -2.1],
  [-4.8, POND_Z-2.6, 1.0, 1.6], [4.8, POND_Z-2.6, 1.0, -1.6],
  [-1.1, POND_Z-BRIDGE_LEN/2-9.3, 0.95, 0.5], [1.1, POND_Z-BRIDGE_LEN/2-9.3, 0.95, -0.5],
  [-6.4, 2.9, 0.85, 1.4], [6.4, 2.9, 0.85, -1.4],
];

const LILY_COUNT = lilySpots.length;
const lilyPetalMesh = new THREE.InstancedMesh(lilyPetalGeo, petalMat, LILY_COUNT);
const lilyStamenMesh = new THREE.InstancedMesh(lilyStamenGeo, filamentAntherMat, LILY_COUNT);
const lilyGreenMesh = new THREE.InstancedMesh(lilyGreenGeo, greenMat, LILY_COUNT);
lilyPetalMesh.castShadow = true;
lilyStamenMesh.castShadow = true;
lilyGreenMesh.castShadow = true;
lilyGreenMesh.receiveShadow = true;

const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _s = new THREE.Vector3();
lilySpots.forEach(([x,z,scale,rotY], i)=>{
  _q.setFromEuler(new THREE.Euler(0, rotY||0, 0));
  _s.set(scale, scale, scale);
  _m.compose(new THREE.Vector3(x,0,z), _q, _s);
  lilyPetalMesh.setMatrixAt(i, _m);
  lilyStamenMesh.setMatrixAt(i, _m);
  lilyGreenMesh.setMatrixAt(i, _m);
  obstacleColliders.push({x,z,r:0.24*scale});
});
lilyPetalMesh.instanceMatrix.needsUpdate = true;
lilyStamenMesh.instanceMatrix.needsUpdate = true;
lilyGreenMesh.instanceMatrix.needsUpdate = true;

scene.add(lilyPetalMesh, lilyStamenMesh, lilyGreenMesh);

/* ===========================================================
   FIREFLIES — small glowing points drifting through the garden,
   real bloom sources for that romantic atmosphere
=========================================================== */
const FIREFLY_COUNT = 45;
const fireflyGeo = new THREE.BufferGeometry();
const fireflyPos = new Float32Array(FIREFLY_COUNT*3);
const fireflyPhase = new Float32Array(FIREFLY_COUNT);
const fireflyBaseY = new Float32Array(FIREFLY_COUNT);
for(let i=0;i<FIREFLY_COUNT;i++){
  const a = Math.random()*Math.PI*2;
  const r = Math.random()*WORLD_R*0.85;
  fireflyPos[i*3+0] = Math.cos(a)*r;
  fireflyBaseY[i] = 0.6 + Math.random()*1.8;
  fireflyPos[i*3+1] = fireflyBaseY[i];
  fireflyPos[i*3+2] = Math.sin(a)*r;
  fireflyPhase[i] = Math.random()*Math.PI*2;
}
fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPos,3));
const fireflyMat = new THREE.PointsMaterial({
  color:0xf3d9ff, size:0.12, transparent:true, opacity:0.9,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
});
const fireflies = new THREE.Points(fireflyGeo, fireflyMat);
scene.add(fireflies);

/* ===========================================================
   VIDEO FRAMES — mounted on freestanding trellis panels around
   the garden loop
=========================================================== */
const frameObjects = [];

FRAMES.forEach((cfg, idx)=>{
  const [x,z] = cfg.pos;
  const FW = 1.9, FH = 1.15, FRAME_DEPTH = 0.06;

  const group = new THREE.Group();
  group.position.set(x, 1.55, z);
  group.rotation.y = cfg.rotY;
  scene.add(group);

  // trellis posts either side, like a small garden display frame
  for(let s=-1;s<=1;s+=2){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.045,3.1,8), woodMat);
    post.position.set(s*(FW/2+0.12), -1.55+1.55, 0);
    post.castShadow = true;
    group.add(post);
  }

  const border = new THREE.Mesh(new THREE.BoxGeometry(FW+0.16, FH+0.16, FRAME_DEPTH), trimMat);
  border.position.z = -0.02;
  border.castShadow = true;
  group.add(border);

  const placeholderTex = makePlaceholderVideoTexture(cfg.title);
  const screenMat = new THREE.MeshBasicMaterial({map:placeholderTex});
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), screenMat);
  screen.position.z = 0.03;
  group.add(screen);

  const capTex = makePlaqueTexture({heading:cfg.title, body:cfg.caption, w:560, h:230, headingSize:32, bodySize:19});
  const capPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.35,0.56), new THREE.MeshBasicMaterial({map:capTex, transparent:true}));
  capPlane.position.set(0, -(FH/2+0.44), 0.02);
  group.add(capPlane);

  const spot = new THREE.SpotLight(0xf3e6ff, 0, 5.5, Math.PI/6, 0.4, 1.6);
  const worldPos = new THREE.Vector3(x,1.55,z);
  const dir = new THREE.Vector3(Math.sin(cfg.rotY),0,Math.cos(cfg.rotY));
  spot.position.copy(worldPos).add(new THREE.Vector3(dir.x*-1.8, 1.1, dir.z*-1.8));
  spot.target.position.copy(worldPos);
  scene.add(spot); scene.add(spot.target);

  const frameObj = {
    group, screen, screenMat, spot,
    worldPos, title: cfg.title,
    video: null, videoTex: null, hasVideo:false
  };
  frameObjects.push(frameObj);
  obstacleColliders.push({x,z,r:0.5});

  // wire up the hosted video, if a source was provided for this frame
  const src = VIDEO_SOURCES[idx];
  if(src){
    const video = document.createElement('video');
    video.src = src;
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.addEventListener('error', ()=>{
      console.warn('Kunne ikke indlæse video for "'+cfg.title+'":', src);
    });
    video.play().catch(()=>{});
    const tex = new THREE.VideoTexture(video);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    video.addEventListener('loadeddata', ()=>{
      frameObj.screenMat.map = tex;
      frameObj.screenMat.needsUpdate = true;
    });
    frameObj.video = video;
    frameObj.videoTex = tex;
    frameObj.hasVideo = true;
  }
});

/* ===========================================================
   POINTER LOCK CONTROLS — fixed to prevent the "flicker to a
   random direction" bug, which came from two sources:
   1) the very first mousemove event after the browser grants
      pointer lock can report a huge, garbage movementX/movementY
      spike (a known Chrome/Firefox quirk) — we now discard it.
   2) unclamped per-frame deltas let any stray large-delta event
      whip the camera around instantly — deltas are now clamped.
=========================================================== */
let yaw = Math.PI;
let pitch = 0;
let locked = false;
let ignoreNextMouseDelta = false;

const startOverlay = document.getElementById('overlay-start');
const enterBtn = document.getElementById('enter-btn');
const hint = document.getElementById('hint');

enterBtn.addEventListener('click', ()=>{
  startOverlay.style.display = 'none';
  renderer.domElement.requestPointerLock();
});

renderer.domElement.addEventListener('click', ()=>{
  if(!locked && startOverlay.style.display==='none'){
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', ()=>{
  locked = document.pointerLockElement === renderer.domElement;
  hint.style.opacity = locked ? '0' : '1';
  if(locked){
    // the first movement sample after (re)acquiring lock is unreliable
    // on some browsers and can report a huge spike — skip it once.
    ignoreNextMouseDelta = true;
  }
});

const MAX_MOUSE_DELTA = 60; // px per event; clamps any spike from a
                             // dropped frame, tab switch, or OS hiccup
document.addEventListener('mousemove', (e)=>{
  if(!locked) return;
  if(ignoreNextMouseDelta){
    ignoreNextMouseDelta = false;
    return;
  }
  const dx = Math.max(-MAX_MOUSE_DELTA, Math.min(MAX_MOUSE_DELTA, e.movementX || 0));
  const dy = Math.max(-MAX_MOUSE_DELTA, Math.min(MAX_MOUSE_DELTA, e.movementY || 0));
  yaw -= dx * 0.0022;
  pitch -= dy * 0.0022;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
});

const keys = {};
document.addEventListener('keydown', (e)=> keys[e.code]=true);
document.addEventListener('keyup', (e)=> keys[e.code]=false);
// if the window loses focus mid-stride, drop all held keys so movement
// doesn't "stick" and jitter when focus returns
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

/* ===========================================================
   MOVEMENT & COLLISION
=========================================================== */
const clock = new THREE.Clock();
const MOVE_SPEED = 3.4;
const allColliders = treeColliders.concat(obstacleColliders).concat(lampColliders);

function onBridge(x,z){
  return x > bridgeCollider.minX && x < bridgeCollider.maxX &&
         z > bridgeCollider.minZ && z < bridgeCollider.maxZ;
}

function resolveCollision(pos){
  // stay within the garden disc
  const distFromCenter = Math.sqrt(pos.x*pos.x + pos.z*pos.z);
  const maxR = WORLD_R - 1.6;
  if(distFromCenter > maxR){
    const k = maxR/distFromCenter;
    pos.x *= k; pos.z *= k;
  }

  const overBridge = onBridge(pos.x, pos.z);
  // keep the player on the bridge deck while crossing the pond, otherwise
  // block them from walking straight into the water
  if(overBridge){
    pos.x = Math.max(bridgeCollider.minX+0.1, Math.min(bridgeCollider.maxX-0.1, pos.x));
  } else {
    const dx = (pos.x-POND_X)/POND_RX, dz = (pos.z-POND_Z)/POND_RZ;
    const pondDist = Math.sqrt(dx*dx+dz*dz);
    if(pondDist < 1.06){
      // push back out to the pond edge along the direction from center
      const ang = Math.atan2(pos.z-POND_Z, pos.x-POND_X);
      pos.x = POND_X + Math.cos(ang)*POND_RX*1.06;
      pos.z = POND_Z + Math.sin(ang)*POND_RZ*1.06;
    }
  }

  allColliders.forEach(c=>{
    const dx = pos.x - c.x, dz = pos.z - c.z;
    const dist = Math.sqrt(dx*dx+dz*dz);
    const minDist = c.r + PLAYER_R;
    if(dist < minDist && dist > 0.0001){
      const push = (minDist - dist);
      pos.x += (dx/dist)*push;
      pos.z += (dz/dist)*push;
    }
  });
  return pos;
}

/* ===========================================================
   PROXIMITY: light up + unmute the nearest frame
=========================================================== */
const captionEl = document.getElementById('proximity-caption');
const NEAR_DIST = 3.2;
const _tmpVec = new THREE.Vector3(); // reused each frame — avoids GC churn
                                      // that was contributing to the lag

function updateFrames(){
  let nearest = null, nearestDist = Infinity;
  for(let i=0;i<frameObjects.length;i++){
    const f = frameObjects[i];
    const d = camera.position.distanceTo(f.worldPos);
    if(d < nearestDist){ nearestDist = d; nearest = f; }
    const targetIntensity = d < NEAR_DIST ? THREE.MathUtils.mapLinear(d,0.6,NEAR_DIST,1.7,0.5) : 0.35;
    f.spot.intensity += (Math.max(0.35,targetIntensity) - f.spot.intensity) * 0.08;

    if(f.hasVideo){
      if(d < NEAR_DIST){
        if(f.video.paused) f.video.play().catch(()=>{});
        f.video.muted = false;
        f.video.volume = Math.max(0, Math.min(1, 1 - (d/NEAR_DIST)));
      } else {
        f.video.muted = true;
      }
    }
  }

  if(nearest && nearestDist < NEAR_DIST){
    captionEl.textContent = nearest.title;
    captionEl.style.opacity = '1';
  } else {
    captionEl.style.opacity = '0';
  }
}

/* ===========================================================
   ANIMATE
=========================================================== */
const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _move = new THREE.Vector3();
const _nextPos = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  if(locked){
    _forward.set(Math.sin(yaw), 0, Math.cos(yaw)).multiplyScalar(-1);
    _right.set(-_forward.z, 0, _forward.x);
    _move.set(0,0,0);
    if(keys['KeyW']||keys['ArrowUp']) _move.add(_forward);
    if(keys['KeyS']||keys['ArrowDown']) _move.sub(_forward);
    if(keys['KeyD']||keys['ArrowRight']) _move.add(_right);
    if(keys['KeyA']||keys['ArrowLeft']) _move.sub(_right);
    if(_move.lengthSq() > 0){
      _move.normalize().multiplyScalar(MOVE_SPEED*dt);
      _nextPos.copy(camera.position).add(_move);
      resolveCollision(_nextPos);
      camera.position.x = _nextPos.x;
      camera.position.z = _nextPos.z;
    }
  }

  // gentle bob for fireflies — cheap sine offsets on the existing buffer,
  // no per-firefly object allocation
  const posAttr = fireflyGeo.attributes.position;
  for(let i=0;i<FIREFLY_COUNT;i++){
    posAttr.array[i*3+1] = fireflyBaseY[i] + Math.sin(t*0.6 + fireflyPhase[i])*0.25;
    posAttr.array[i*3+0] += Math.sin(t*0.3 + fireflyPhase[i]*2)*0.0015;
  }
  posAttr.needsUpdate = true;

  updateFrames();
  composer.render();
}
animate();

})();
</script>
